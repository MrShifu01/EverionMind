<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1310" />
    <title>Everion Mind — Launch Knowledge Base</title>
    <style>
      :root {
        --bg: #f7f3ee;
        --surface: #fffcf6;
        --surface-high: #ffffff;
        --surface-sunk: #efe7da;
        --ink: #2a1f1a;
        --ink-soft: #5b4b41;
        --ink-faint: #94857a;
        --ink-ghost: #b8aca0;
        --line: #e6dccf;
        --line-soft: #efe7da;
        --line-strong: #d4c8b7;
        --ember: #c64f17;
        --ember-wash: #fbe5d6;
        --moss: #4d7755;
        --moss-wash: #e0eadf;
        --blood: #a83a2a;
        --blood-wash: #f7d9d3;
        --gold: #b88a2c;
        --gold-wash: #f3e9cf;
        --slate: #6b6155;
        --slate-wash: #ebe5dc;
        --shadow-sm: 0 1px 2px rgba(42, 31, 26, 0.06);
        --shadow-md: 0 2px 8px rgba(42, 31, 26, 0.08);
        --shadow-lg: 0 8px 24px rgba(42, 31, 26, 0.12);
        --shadow-drawer: 0 0 40px rgba(42, 31, 26, 0.18);
        --f-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --f-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Source Serif 4", Georgia, serif;
        --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16110d;
          --surface: #1d1612;
          --surface-high: #251c17;
          --surface-sunk: #120d0a;
          --ink: #f0e6da;
          --ink-soft: #c0b3a4;
          --ink-faint: #8a7a6c;
          --ink-ghost: #5b4d43;
          --line: #2f251f;
          --line-soft: #261d18;
          --line-strong: #3d3027;
          --ember: #e6814d;
          --ember-wash: #3a221a;
          --moss: #7fa787;
          --moss-wash: #1d2a20;
          --blood: #d66659;
          --blood-wash: #2e1a18;
          --gold: #d6ab57;
          --gold-wash: #2d2316;
          --slate: #9a9082;
          --slate-wash: #221c17;
          --shadow-drawer: 0 0 40px rgba(0, 0, 0, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 var(--f-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button { font: inherit; color: inherit; }
      a { color: var(--ember); text-decoration: none; }
      a:hover { text-decoration: underline; }
      ::selection { background: var(--ember-wash); color: var(--ink); }

      /* === SHELL =========================================================== */
      .shell {
        display: grid;
        grid-template-columns: 240px 1fr;
        height: 100vh;
        height: 100dvh;
      }
      .shell.has-detail { grid-template-columns: 240px 1fr 540px; }
      @media (max-width: 900px) {
        .shell, .shell.has-detail { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .detail { display: none; }
      }

      /* === SIDEBAR ========================================================= */
      .sidebar {
        background: var(--surface-sunk);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .brand {
        padding: 16px 16px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--line-soft);
      }
      .brand-mark {
        width: 22px; height: 22px;
        border-radius: 6px;
        background: var(--ember);
        display: flex; align-items: center; justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: -0.02em;
      }
      .brand-name {
        font-weight: 600;
        font-size: 13px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .sidebar-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px 12px;
        scrollbar-width: thin;
      }
      .nav-group { margin-top: 10px; }
      .nav-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-faint);
        padding: 6px 8px 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .nav-label-count {
        font-weight: 500;
        letter-spacing: 0.04em;
        opacity: 0.7;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 12.5px;
        line-height: 1.3;
        user-select: none;
        position: relative;
      }
      .nav-item:hover { background: var(--surface); color: var(--ink); }
      .nav-item.is-active {
        background: var(--ember-wash);
        color: var(--ember);
        font-weight: 500;
      }
      .nav-item.is-active .nav-icon { color: var(--ember); }
      .nav-icon {
        width: 14px; height: 14px;
        display: inline-flex; align-items: center; justify-content: center;
        color: var(--ink-faint);
        flex-shrink: 0;
      }
      .nav-count {
        margin-left: auto;
        font-size: 11px;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
      }
      .nav-item.is-active .nav-count { color: var(--ember); opacity: 0.8; }

      /* === MAIN ============================================================ */
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }
      .topbar {
        height: 48px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg);
      }
      .topbar-title {
        font-weight: 600;
        font-size: 14px;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .topbar-count {
        font-size: 12px;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
      }
      .topbar-spacer { flex: 1; }
      .iconbtn {
        height: 28px;
        min-width: 28px;
        padding: 0 8px;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink-soft);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .iconbtn:hover { background: var(--surface-high); color: var(--ink); border-color: var(--line-strong); }
      .kbd {
        font-family: var(--f-mono);
        font-size: 10.5px;
        padding: 1px 5px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        color: var(--ink-faint);
      }

      /* === TASK LIST ====================================================== */
      .tasklist {
        flex: 1;
        overflow-y: auto;
        background: var(--bg);
      }
      .empty-state {
        padding: 80px 20px;
        text-align: center;
        color: var(--ink-faint);
      }
      .empty-state .empty-title {
        font-family: var(--f-serif);
        font-style: italic;
        font-size: 15px;
        color: var(--ink-soft);
      }
      .empty-state .empty-sub {
        margin-top: 6px;
        font-size: 12px;
      }
      .group-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-faint);
        background: var(--bg);
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .group-header::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line-soft);
      }
      .group-count {
        font-weight: 500;
        color: var(--ink-ghost);
        margin-left: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: 28px 36px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 7px 18px;
        border-bottom: 1px solid var(--line-soft);
        cursor: pointer;
        color: var(--ink);
        position: relative;
        min-height: 36px;
      }
      .row:hover { background: var(--surface-high); }
      .row.is-cursor {
        background: var(--ember-wash);
      }
      .row.is-cursor::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 2px;
        background: var(--ember);
      }
      .row.is-done .row-text {
        color: var(--ink-faint);
        text-decoration: line-through;
        text-decoration-color: var(--ink-ghost);
      }
      .checkbox {
        width: 16px; height: 16px;
        border-radius: 4px;
        border: 1.4px solid var(--line-strong);
        background: var(--surface);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 80ms, border-color 80ms;
      }
      .checkbox:hover { border-color: var(--ember); }
      .checkbox.is-checked {
        background: var(--moss);
        border-color: var(--moss);
        color: #fff;
      }
      .checkbox.is-checked svg { display: block; }
      .checkbox svg { display: none; }
      .priority {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 18px;
        min-width: 28px;
        padding: 0 6px;
        border-radius: 4px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--ink-faint);
        background: var(--surface-sunk);
        font-variant-numeric: tabular-nums;
      }
      .priority.is-p0 { color: var(--blood); background: var(--blood-wash); }
      .priority.is-p1 { color: var(--ember); background: var(--ember-wash); }
      .priority.is-p2 { color: var(--gold); background: var(--gold-wash); }
      .priority.is-p3 { color: var(--slate); background: var(--slate-wash); }
      .priority.is-empty { background: transparent; color: var(--ink-ghost); }
      .row-text {
        font-size: 13px;
        color: var(--ink);
        line-height: 1.4;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .row-text code {
        font-family: var(--f-mono);
        font-size: 11.5px;
        padding: 1px 4px;
        background: var(--surface-sunk);
        border-radius: 3px;
        color: var(--ink);
      }
      .row-text strong { color: var(--ink); font-weight: 600; }
      .row-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 7px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 11px;
        color: var(--ink-soft);
        background: var(--surface);
        white-space: nowrap;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip.is-date { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      .chip.is-archived { color: var(--ink-ghost); border-style: dashed; }
      .row-mtime {
        font-size: 11px;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
        min-width: 52px;
        text-align: right;
      }

      /* === DETAIL PANE ===================================================== */
      .detail {
        background: var(--surface);
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        animation: slideIn 160ms ease-out;
      }
      @keyframes slideIn {
        from { transform: translateX(8px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .detail-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line-soft);
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .detail-head-text { flex: 1; min-width: 0; }
      .detail-breadcrumb {
        font-size: 11px;
        color: var(--ink-faint);
        font-family: var(--f-mono);
      }
      .detail-title {
        font-size: 14px;
        font-weight: 600;
        margin-top: 3px;
        color: var(--ink);
        word-break: break-word;
      }
      .detail-close {
        width: 26px; height: 26px;
        border-radius: 6px;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink-soft);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .detail-close:hover { background: var(--surface-high); color: var(--ink); }
      .detail-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 22px 60px;
        font-family: var(--f-serif);
        font-size: 14.5px;
        line-height: 1.65;
        color: var(--ink);
      }
      .detail-body h1, .detail-body h2, .detail-body h3, .detail-body h4 {
        font-family: var(--f-sans);
        letter-spacing: -0.01em;
        color: var(--ink);
        line-height: 1.25;
      }
      .detail-body h1 { font-size: 20px; margin: 18px 0 8px; }
      .detail-body h2 { font-size: 16px; margin: 22px 0 6px; }
      .detail-body h3 { font-size: 14px; margin: 18px 0 4px; }
      .detail-body p { margin: 8px 0; }
      .detail-body ul, .detail-body ol { padding-left: 22px; margin: 8px 0; }
      .detail-body li { margin: 2px 0; }
      .detail-body code {
        font-family: var(--f-mono);
        font-size: 12px;
        padding: 1px 4px;
        background: var(--surface-sunk);
        border-radius: 3px;
      }
      .detail-body pre {
        background: var(--surface-sunk);
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        padding: 10px 12px;
        overflow-x: auto;
        font-family: var(--f-mono);
        font-size: 12px;
        line-height: 1.5;
        margin: 10px 0;
      }
      .detail-body pre code { background: transparent; padding: 0; font-size: inherit; }
      .detail-body blockquote {
        border-left: 3px solid var(--ember);
        padding: 4px 12px;
        margin: 10px 0;
        color: var(--ink-soft);
        background: var(--ember-wash);
        border-radius: 0 6px 6px 0;
        font-style: italic;
      }
      .detail-body hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 22px 0;
      }
      .detail-body table {
        border-collapse: collapse;
        margin: 10px 0;
        font-size: 12.5px;
        font-family: var(--f-sans);
      }
      .detail-body th, .detail-body td {
        border: 1px solid var(--line);
        padding: 5px 9px;
        text-align: left;
        vertical-align: top;
      }
      .detail-body th { background: var(--surface-sunk); font-weight: 600; }
      .detail-body .task-line {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 2px 4px;
        border-radius: 4px;
      }
      .detail-body .task-line.is-highlight {
        background: var(--ember-wash);
        outline: 1px solid var(--ember);
        outline-offset: -1px;
      }
      .detail-body .task-line input[type="checkbox"] {
        margin-top: 5px;
      }

      /* === PALETTE ========================================================= */
      .palette-backdrop {
        position: fixed; inset: 0;
        background: rgba(20, 14, 10, 0.45);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 14vh;
        z-index: 50;
      }
      .palette {
        width: min(640px, 92vw);
        max-height: 64vh;
        background: var(--surface-high);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .palette input {
        height: 48px;
        padding: 0 18px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font: 15px/1.2 var(--f-sans);
        outline: none;
        width: 100%;
      }
      .palette-results {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0;
      }
      .palette-row {
        padding: 8px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-size: 13px;
        color: var(--ink);
      }
      .palette-row.is-active { background: var(--ember-wash); }
      .palette-row-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .palette-row-src { font-size: 11px; color: var(--ink-faint); }
      .palette-row .checkbox { width: 14px; height: 14px; }
      .palette-empty {
        padding: 30px 18px;
        text-align: center;
        color: var(--ink-faint);
        font-style: italic;
      }
      .palette-foot {
        padding: 8px 18px;
        border-top: 1px solid var(--line-soft);
        font-size: 11px;
        color: var(--ink-faint);
        display: flex;
        gap: 14px;
      }

      /* === FILTER BAR (sticky inside main) ================================= */
      .filterbar {
        height: 36px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg);
        overflow-x: auto;
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 11px;
        font-size: 11px;
        color: var(--ink-soft);
        background: var(--surface);
        cursor: pointer;
        white-space: nowrap;
      }
      .filter-chip:hover { background: var(--surface-high); color: var(--ink); }
      .filter-chip.is-on {
        background: var(--ember-wash);
        color: var(--ember);
        border-color: var(--ember);
      }
      .filter-x { opacity: 0.6; margin-left: 2px; }
      .filter-clear {
        font-size: 11px;
        color: var(--ember);
        cursor: pointer;
        padding: 0 6px;
      }
      .filter-clear:hover { text-decoration: underline; }

      /* === MISC ============================================================ */
      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        font-size: 12.5px;
        padding: 9px 14px;
        border-radius: 8px;
        box-shadow: var(--shadow-lg);
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms;
        z-index: 60;
      }
      .toast.is-visible { opacity: 1; }
      .spinner {
        display: inline-block;
        width: 12px; height: 12px;
        border: 2px solid var(--line);
        border-top-color: var(--ember);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
        vertical-align: -2px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .visually-hidden {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); border: 0;
      }
    </style>
  </head>
  <body>
    <div id="app" class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">E</div>
          <div class="brand-name">Everion Launch</div>
        </div>
        <div class="sidebar-scroll" id="sidebar-scroll"></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-title" id="view-title">All tasks</div>
          <div class="topbar-count" id="view-count">—</div>
          <div class="topbar-spacer"></div>
          <button class="iconbtn" id="search-btn" title="Search (⌘K)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            Search
            <span class="kbd">⌘K</span>
          </button>
        </header>
        <div class="filterbar" id="filterbar"></div>
        <div class="tasklist" id="tasklist"></div>
      </main>
      <aside class="detail" id="detail" style="display:none"></aside>
    </div>
    <div id="palette-root"></div>
    <div class="toast" id="toast"></div>
    <script>
    (() => {
      const $ = (sel, root = document) => root.querySelector(sel);
      const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
      const escapeAttr = escapeHtml;

      // ----- STATE -----
      const state = {
        tasks: [],
        loading: true,
        view: "all",          // all | open | done | priority | week | source:<name>
        cursorId: null,
        openId: null,
        openMarkdown: null,
        openMtime: null,
        searchOpen: false,
        searchQuery: "",
        searchSelected: 0,
      };

      // ----- API -----
      async function fetchTasks() {
        const r = await fetch("/tasks", { cache: "no-store" });
        if (!r.ok) throw new Error("tasks " + r.status);
        const j = await r.json();
        return j.tasks;
      }
      async function fetchDoc(rel) {
        const r = await fetch("/docs/" + encodeURIComponent(rel), { cache: "no-store" });
        if (!r.ok) throw new Error("doc " + r.status);
        return { content: await r.text(), mtime: Number(r.headers.get("x-mtime") || 0) };
      }
      async function toggleTask(docPath, lineNumber, checked) {
        const r = await fetch("/toggle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ docPath, lineNumber, checked }),
        });
        if (!r.ok) throw new Error("toggle " + r.status);
        return r.json();
      }

      // ----- TASK FILTERING / GROUPING -----
      function viewFilter(task) {
        const v = state.view;
        if (task.archived) return v === "source:" + task.source;  // archived only visible in their source
        if (v === "all") return true;
        if (v === "open") return !task.checked;
        if (v === "done") return task.checked;
        if (v === "priority") return !!task.priority;
        if (v === "week") {
          const wk = 7 * 24 * 60 * 60 * 1000;
          return Date.now() - task.mtime < wk;
        }
        if (v.startsWith("source:")) return task.source === v.slice(7);
        return true;
      }

      function visibleTasks() { return state.tasks.filter(viewFilter); }

      const PRIORITY_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3, "": 4 };
      function groupTasks(tasks) {
        // Default: group by priority bucket, sort within by mtime desc.
        const groups = new Map();
        for (const t of tasks) {
          const key = t.priority || "—";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(t);
        }
        const sorted = [...groups.entries()].sort((a, b) => {
          return (PRIORITY_ORDER[a[0] === "—" ? "" : a[0]] ?? 5) - (PRIORITY_ORDER[b[0] === "—" ? "" : b[0]] ?? 5);
        });
        for (const [, list] of sorted) list.sort((a, b) => b.mtime - a.mtime);
        return sorted;
      }

      function sourceCounts() {
        const m = new Map();
        for (const t of state.tasks) {
          if (t.archived) continue;
          m.set(t.source, (m.get(t.source) || 0) + 1);
        }
        return [...m.entries()].sort((a, b) => b[1] - a[1]);
      }

      // ----- SIDEBAR RENDER -----
      function renderSidebar() {
        const v = state.view;
        const counts = {
          all: state.tasks.filter(t => !t.archived).length,
          open: state.tasks.filter(t => !t.archived && !t.checked).length,
          done: state.tasks.filter(t => !t.archived && t.checked).length,
          priority: state.tasks.filter(t => !t.archived && t.priority).length,
          week: state.tasks.filter(t => !t.archived && Date.now() - t.mtime < 7*24*3600*1000).length,
        };
        const ic = {
          all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
          open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>',
          done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
          priority: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4a1 1 0 011-1h7l1 3h6v10H10l-1-3H4"/></svg>',
          week: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
          src: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg>',
        };
        const navHtml = `
          <div class="nav-group">
            <div class="nav-label">Views</div>
            ${renderNav("all", "All tasks", counts.all, ic.all, v)}
            ${renderNav("open", "Open", counts.open, ic.open, v)}
            ${renderNav("done", "Done", counts.done, ic.done, v)}
            ${renderNav("priority", "Prioritised", counts.priority, ic.priority, v)}
            ${renderNav("week", "Active this week", counts.week, ic.week, v)}
          </div>
          <div class="nav-group">
            <div class="nav-label"><span>Sources</span> <span class="nav-label-count">${sourceCounts().length}</span></div>
            ${sourceCounts().map(([src, n]) => renderNav("source:" + src, src, n, ic.src, v)).join("")}
          </div>
        `;
        $("#sidebar-scroll").innerHTML = navHtml;
        $("#sidebar-scroll").addEventListener("click", onNavClick);
      }
      function renderNav(viewId, label, count, icon, active) {
        const cls = active === viewId ? "nav-item is-active" : "nav-item";
        return `<div class="${cls}" data-view="${escapeAttr(viewId)}"><span class="nav-icon">${icon}</span><span>${escapeHtml(label)}</span><span class="nav-count">${count}</span></div>`;
      }
      function onNavClick(e) {
        const item = e.target.closest("[data-view]");
        if (!item) return;
        state.view = item.dataset.view;
        state.cursorId = null;
        render();
      }

      // ----- TASK LIST RENDER -----
      function priorityHtml(p) {
        if (!p) return `<span class="priority is-empty">—</span>`;
        return `<span class="priority is-${p.toLowerCase()}">${p}</span>`;
      }
      function relativeMtime(ms) {
        const diff = Date.now() - ms;
        const d = 24 * 3600 * 1000;
        if (diff < 60_000) return "now";
        if (diff < 3600_000) return Math.round(diff / 60_000) + "m";
        if (diff < d) return Math.round(diff / 3600_000) + "h";
        if (diff < 30 * d) return Math.round(diff / d) + "d";
        return new Date(ms).toISOString().slice(0, 10);
      }
      // Minimal inline-text renderer for task lines. Handles `code`, **bold**.
      function renderInline(s) {
        // Mask code first so its content escapes special handling.
        const tokens = [];
        let masked = s.replace(/`([^`]+)`/g, (_, code) => {
          tokens.push(`<code>${escapeHtml(code)}</code>`);
          return `\x00${tokens.length - 1}\x00`;
        });
        masked = escapeHtml(masked);
        masked = masked.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        return masked.replace(/\x00(\d+)\x00/g, (_, i) => tokens[Number(i)]);
      }
      function rowHtml(t, isCursor) {
        const cls = ["row"];
        if (t.checked) cls.push("is-done");
        if (isCursor) cls.push("is-cursor");
        const date = t.dueDate ? `<span class="chip is-date">${escapeHtml(t.dueDate)}</span>` : "";
        const arch = t.archived ? `<span class="chip is-archived">archive</span>` : "";
        return `
          <div class="${cls.join(" ")}" data-id="${escapeAttr(t.id)}">
            <button class="checkbox ${t.checked ? "is-checked" : ""}" data-checkbox aria-label="${t.checked ? "Mark open" : "Mark done"}">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
            ${priorityHtml(t.priority)}
            <span class="row-text">${renderInline(t.text)}</span>
            <span class="row-meta">
              ${date}
              ${arch}
              <span class="chip">${escapeHtml(t.source)}</span>
              <span class="row-mtime">${relativeMtime(t.mtime)}</span>
            </span>
          </div>
        `;
      }
      function renderTaskList() {
        const tasks = visibleTasks();
        const grouped = groupTasks(tasks);
        $("#view-title").textContent = viewLabel();
        $("#view-count").textContent = tasks.length + (state.loading ? " · loading" : "");
        if (!tasks.length) {
          $("#tasklist").innerHTML = `<div class="empty-state"><div class="empty-title">Nothing here.</div><div class="empty-sub">Switch view or pick a source on the left.</div></div>`;
          return;
        }
        // Ensure cursor lives inside the visible set
        if (!state.cursorId || !tasks.some(t => t.id === state.cursorId)) {
          state.cursorId = tasks[0]?.id || null;
        }
        let html = "";
        for (const [bucket, list] of grouped) {
          const lbl = bucket === "—" ? "No priority" : bucket;
          html += `<div class="group-header">${escapeHtml(lbl)} <span class="group-count">${list.length}</span></div>`;
          for (const t of list) html += rowHtml(t, t.id === state.cursorId);
        }
        $("#tasklist").innerHTML = html;
      }
      function viewLabel() {
        const v = state.view;
        if (v === "all") return "All tasks";
        if (v === "open") return "Open";
        if (v === "done") return "Done";
        if (v === "priority") return "Prioritised";
        if (v === "week") return "Active this week";
        if (v.startsWith("source:")) return v.slice(7);
        return "Tasks";
      }
      function renderFilterBar() {
        const v = state.view;
        const isDefault = v === "all";
        if (isDefault) { $("#filterbar").innerHTML = ""; $("#filterbar").style.display = "none"; return; }
        $("#filterbar").style.display = "flex";
        $("#filterbar").innerHTML = `
          <span class="filter-chip is-on">${escapeHtml(viewLabel())}<span class="filter-x" data-clear-view>×</span></span>
          <span class="filter-clear" data-clear-view>Reset</span>
        `;
        $("#filterbar").addEventListener("click", (e) => {
          if (e.target.closest("[data-clear-view]")) {
            state.view = "all";
            state.cursorId = null;
            render();
          }
        }, { once: true });
      }

      // ----- ROW INTERACTIONS -----
      function onTaskListClick(e) {
        const cbBtn = e.target.closest("[data-checkbox]");
        const row = e.target.closest(".row");
        if (!row) return;
        const id = row.dataset.id;
        const task = state.tasks.find(t => t.id === id);
        if (!task) return;
        if (cbBtn) {
          e.stopPropagation();
          handleToggle(task);
          return;
        }
        state.cursorId = id;
        openDetail(task);
        render();
      }

      async function handleToggle(task) {
        const newChecked = !task.checked;
        task.checked = newChecked;                 // optimistic
        render();
        try {
          await toggleTask(task.docPath, task.lineNumber, newChecked);
          toast(newChecked ? "Marked done" : "Reopened");
        } catch (err) {
          task.checked = !newChecked;              // revert
          render();
          toast("Toggle failed");
        }
      }

      // ----- DETAIL PANE -----
      async function openDetail(task) {
        state.openId = task.id;
        $("#app").classList.add("has-detail");
        const elDetail = $("#detail");
        elDetail.style.display = "flex";
        elDetail.innerHTML = renderDetailShell(task, true);
        try {
          const { content, mtime } = await fetchDoc(task.docPath);
          state.openMarkdown = content;
          state.openMtime = mtime;
          elDetail.innerHTML = renderDetailShell(task, false);
          // Scroll the highlighted line into view.
          requestAnimationFrame(() => {
            const hl = $(".task-line.is-highlight", elDetail);
            if (hl) hl.scrollIntoView({ block: "center", behavior: "auto" });
          });
        } catch (err) {
          elDetail.querySelector(".detail-body").innerHTML = `<p style="color:var(--blood)">Failed to load ${escapeHtml(task.docPath)}: ${escapeHtml(err.message || String(err))}</p>`;
        }
      }
      function closeDetail() {
        state.openId = null;
        state.openMarkdown = null;
        $("#app").classList.remove("has-detail");
        $("#detail").style.display = "none";
        $("#detail").innerHTML = "";
      }
      function renderDetailShell(task, loading) {
        const body = loading
          ? `<p style="color:var(--ink-faint)"><span class="spinner"></span> Loading ${escapeHtml(task.docPath)}…</p>`
          : renderMarkdown(state.openMarkdown, task);
        return `
          <div class="detail-head">
            <div class="detail-head-text">
              <div class="detail-breadcrumb">${escapeHtml(task.docPath)} · line ${task.lineNumber}</div>
              <div class="detail-title">${renderInline(task.text)}</div>
            </div>
            <button class="detail-close" data-close-detail title="Close (esc)">×</button>
          </div>
          <div class="detail-body">${body}</div>
        `;
      }

      // ----- MARKDOWN RENDERER (minimal) -----
      function renderMarkdown(src, task) {
        const lines = src.split(/\r?\n/);
        const out = [];
        let i = 0;
        let inCode = false;
        let codeBuf = [];
        let listType = null;       // "ul" | "ol" | null
        let listBuf = [];
        let tableBuf = [];
        function flushList() {
          if (!listType) return;
          out.push(`<${listType}>` + listBuf.join("") + `</${listType}>`);
          listType = null; listBuf = [];
        }
        function flushTable() {
          if (!tableBuf.length) return;
          const rows = tableBuf;
          // Strip alignment row if present.
          let alignRowIdx = -1;
          for (let r = 0; r < rows.length; r++) {
            if (/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(rows[r])) { alignRowIdx = r; break; }
          }
          const parsed = rows.map(r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim()));
          const head = alignRowIdx > 0 ? parsed[alignRowIdx - 1] : null;
          const bodyRows = parsed.filter((_, idx) => idx !== alignRowIdx && (head ? idx !== alignRowIdx - 1 : true));
          let h = "<table>";
          if (head) h += "<thead><tr>" + head.map(c => `<th>${renderInline(c)}</th>`).join("") + "</tr></thead>";
          h += "<tbody>";
          for (const r of bodyRows) h += "<tr>" + r.map(c => `<td>${renderInline(c)}</td>`).join("") + "</tr>";
          h += "</tbody></table>";
          out.push(h);
          tableBuf = [];
        }
        for (i = 0; i < lines.length; i++) {
          const line = lines[i];
          const lineNum = i + 1;
          // Fenced code
          if (/^```/.test(line)) {
            if (!inCode) {
              flushList(); flushTable();
              inCode = true; codeBuf = [];
            } else {
              out.push(`<pre><code>${escapeHtml(codeBuf.join("\n"))}</code></pre>`);
              inCode = false; codeBuf = [];
            }
            continue;
          }
          if (inCode) { codeBuf.push(line); continue; }
          // Table row
          if (/^\s*\|.*\|\s*$/.test(line)) {
            flushList();
            tableBuf.push(line);
            continue;
          } else if (tableBuf.length) {
            flushTable();
          }
          // Horizontal rule
          if (/^---+\s*$/.test(line)) { flushList(); out.push("<hr/>"); continue; }
          // Heading
          const hMatch = /^(#{1,4})\s+(.+?)\s*$/.exec(line);
          if (hMatch) { flushList(); out.push(`<h${hMatch[1].length}>${renderInline(hMatch[2])}</h${hMatch[1].length}>`); continue; }
          // Blockquote
          if (/^>\s?/.test(line)) {
            flushList();
            out.push(`<blockquote>${renderInline(line.replace(/^>\s?/, ""))}</blockquote>`);
            continue;
          }
          // Checkbox list item
          const cbMatch = /^(\s*)[-*]\s+\[([ xX])\]\s+(.*)$/.exec(line);
          if (cbMatch) {
            if (listType !== "ul") { flushList(); listType = "ul"; }
            const checked = cbMatch[2].toLowerCase() === "x";
            const isHL = task && task.lineNumber === lineNum;
            listBuf.push(`<li><span class="task-line${isHL ? " is-highlight" : ""}" data-line="${lineNum}"><input type="checkbox" ${checked ? "checked" : ""} disabled />${renderInline(cbMatch[3])}</span></li>`);
            continue;
          }
          // Unordered list item
          const ulMatch = /^(\s*)[-*]\s+(.*)$/.exec(line);
          if (ulMatch) {
            if (listType !== "ul") { flushList(); listType = "ul"; }
            listBuf.push(`<li>${renderInline(ulMatch[2])}</li>`);
            continue;
          }
          // Ordered list item
          const olMatch = /^(\s*)\d+\.\s+(.*)$/.exec(line);
          if (olMatch) {
            if (listType !== "ol") { flushList(); listType = "ol"; }
            listBuf.push(`<li>${renderInline(olMatch[2])}</li>`);
            continue;
          }
          // Paragraph / blank
          if (!line.trim()) { flushList(); continue; }
          flushList();
          out.push(`<p>${renderInline(line)}</p>`);
        }
        flushList();
        flushTable();
        if (inCode) out.push(`<pre><code>${escapeHtml(codeBuf.join("\n"))}</code></pre>`);
        return out.join("\n");
      }

      // ----- CMD+K PALETTE -----
      function openPalette() {
        state.searchOpen = true;
        state.searchQuery = "";
        state.searchSelected = 0;
        renderPalette();
        setTimeout(() => $("#palette-input")?.focus(), 0);
      }
      function closePalette() {
        state.searchOpen = false;
        $("#palette-root").innerHTML = "";
      }
      function paletteResults() {
        const q = state.searchQuery.trim().toLowerCase();
        if (!q) return [];
        const tasks = state.tasks.filter(t => !t.archived);
        const scored = [];
        for (const t of tasks) {
          const hay = (t.text + " " + t.source + " " + (t.priority || "")).toLowerCase();
          const idx = hay.indexOf(q);
          if (idx === -1) continue;
          scored.push({ t, score: idx + (t.checked ? 1000 : 0) });
        }
        scored.sort((a, b) => a.score - b.score);
        return scored.slice(0, 30).map(s => s.t);
      }
      function renderPalette() {
        if (!state.searchOpen) { $("#palette-root").innerHTML = ""; return; }
        const results = paletteResults();
        if (state.searchSelected >= results.length) state.searchSelected = Math.max(0, results.length - 1);
        const rows = results.length
          ? results.map((t, idx) => `
              <div class="palette-row ${idx === state.searchSelected ? "is-active" : ""}" data-pal-idx="${idx}">
                <span class="checkbox ${t.checked ? "is-checked" : ""}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
                <span class="palette-row-text">${renderInline(t.text)}</span>
                <span class="palette-row-src">${escapeHtml(t.source)}</span>
              </div>`).join("")
          : (state.searchQuery.trim() ? `<div class="palette-empty">No matches for "${escapeHtml(state.searchQuery)}".</div>` : `<div class="palette-empty">Start typing to search ${state.tasks.length} tasks.</div>`);
        $("#palette-root").innerHTML = `
          <div class="palette-backdrop" id="palette-backdrop">
            <div class="palette" role="dialog" aria-modal="true">
              <input id="palette-input" placeholder="Search tasks…" value="${escapeAttr(state.searchQuery)}" autocomplete="off" />
              <div class="palette-results" id="palette-results">${rows}</div>
              <div class="palette-foot">
                <span><span class="kbd">↑</span> <span class="kbd">↓</span> navigate</span>
                <span><span class="kbd">↵</span> open</span>
                <span><span class="kbd">esc</span> close</span>
              </div>
            </div>
          </div>
        `;
        const input = $("#palette-input");
        input.addEventListener("input", (e) => { state.searchQuery = e.target.value; state.searchSelected = 0; renderPalette(); setTimeout(() => $("#palette-input")?.focus(), 0); });
        $("#palette-backdrop").addEventListener("click", (e) => { if (e.target.id === "palette-backdrop") closePalette(); });
        $("#palette-results").addEventListener("click", (e) => {
          const r = e.target.closest("[data-pal-idx]");
          if (!r) return;
          const idx = Number(r.dataset.palIdx);
          const t = paletteResults()[idx];
          if (t) {
            closePalette();
            state.cursorId = t.id;
            openDetail(t);
            render();
          }
        });
      }

      // ----- KEYBOARD -----
      function visibleFlat() {
        // Return the flat order of currently rendered rows (matches grouped order)
        const tasks = visibleTasks();
        const grouped = groupTasks(tasks);
        const flat = [];
        for (const [, list] of grouped) flat.push(...list);
        return flat;
      }
      function moveCursor(delta) {
        const flat = visibleFlat();
        if (!flat.length) return;
        let idx = flat.findIndex(t => t.id === state.cursorId);
        if (idx === -1) idx = 0;
        idx = Math.max(0, Math.min(flat.length - 1, idx + delta));
        state.cursorId = flat[idx].id;
        render();
        const el = document.querySelector(`.row[data-id="${CSS.escape(state.cursorId)}"]`);
        if (el) el.scrollIntoView({ block: "nearest" });
      }
      function onKey(e) {
        // Palette has its own key handling when open.
        if (state.searchOpen) {
          if (e.key === "Escape") { e.preventDefault(); closePalette(); return; }
          if (e.key === "ArrowDown") { e.preventDefault(); state.searchSelected++; renderPalette(); setTimeout(() => $("#palette-input")?.focus(), 0); return; }
          if (e.key === "ArrowUp")   { e.preventDefault(); state.searchSelected = Math.max(0, state.searchSelected - 1); renderPalette(); setTimeout(() => $("#palette-input")?.focus(), 0); return; }
          if (e.key === "Enter") {
            e.preventDefault();
            const t = paletteResults()[state.searchSelected];
            if (t) { closePalette(); state.cursorId = t.id; openDetail(t); render(); }
            return;
          }
          return;
        }
        const inEditable = e.target.closest("input, textarea, [contenteditable]");
        // Cmd/Ctrl+K toggles palette regardless of focus
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openPalette();
          return;
        }
        if (inEditable) return;
        if (e.key === "Escape" && state.openId) { e.preventDefault(); closeDetail(); return; }
        if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveCursor(1); return; }
        if (e.key === "k" || e.key === "ArrowUp")   { e.preventDefault(); moveCursor(-1); return; }
        if (e.key === "Enter") {
          e.preventDefault();
          const t = state.tasks.find(t => t.id === state.cursorId);
          if (t) openDetail(t);
          return;
        }
        if (e.key === " " || e.key === "x") {
          e.preventDefault();
          const t = state.tasks.find(t => t.id === state.cursorId);
          if (t) handleToggle(t);
          return;
        }
        if (e.key === "/") {
          e.preventDefault();
          openPalette();
          return;
        }
      }

      // ----- TOAST -----
      let toastTimer;
      function toast(msg) {
        const el = $("#toast");
        el.textContent = msg;
        el.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("is-visible"), 1800);
      }

      // ----- RENDER ENTRY -----
      function render() {
        renderSidebar();
        renderTaskList();
        renderFilterBar();
        // If detail open and the task no longer exists (e.g., removed from
        // file), close the slide-over so we don't render stale content.
        if (state.openId && !state.tasks.some(t => t.id === state.openId)) {
          closeDetail();
        }
      }

      // ----- POLL LOOP -----
      let pollTimer;
      async function refresh() {
        try {
          const tasks = await fetchTasks();
          state.tasks = tasks;
          state.loading = false;
          render();
          // If the open detail's source file changed, re-fetch markdown so
          // the slide-over reflects the edit immediately.
          if (state.openId) {
            const t = tasks.find(x => x.id === state.openId);
            if (t) {
              try {
                const { content, mtime } = await fetchDoc(t.docPath);
                if (mtime !== state.openMtime) {
                  state.openMarkdown = content;
                  state.openMtime = mtime;
                  $("#detail").innerHTML = renderDetailShell(t, false);
                }
              } catch {}
            }
          }
        } catch (err) {
          state.loading = false;
          render();
          console.error(err);
        }
      }
      function startPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(refresh, 2500);
      }

      // ----- WIRE -----
      document.getElementById("tasklist").addEventListener("click", onTaskListClick);
      document.getElementById("search-btn").addEventListener("click", openPalette);
      document.getElementById("detail").addEventListener("click", (e) => {
        if (e.target.closest("[data-close-detail]")) closeDetail();
      });
      window.addEventListener("keydown", onKey);

      // Initial state
      render();
      refresh().then(startPolling);
    })();
    </script>
  </body>
</html>
